name: Validate research network

on:
  push:
    branches: [main, "hardening/**", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate canonical manifest and ranges
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q tools research_network.py services
      - name: Validate manifest and accepted ranges
        run: python tools/validate_research_repository.py
      - name: Install optional service test dependencies
        run: python -m pip install -r services/contribution_api/requirements-test.txt
      - name: Run bounded repository, client, and service tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate the static progress site
        run: python tools/validate_website.py
      - name: Check JavaScript syntax
        run: node --check progress/app.js

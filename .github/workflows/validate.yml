name: Validate research data

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate network records and checkpoint
        run: python tools/validate_network.py
      - name: Run unit tests
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Build dashboard data
        run: python tools/build_site_data.py

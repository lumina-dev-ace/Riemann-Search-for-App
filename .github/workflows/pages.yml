name: Deploy research progress site

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "progress/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate manifest and accepted ranges
        run: python tools/validate_research_repository.py
      - name: Validate progress site and JavaScript
        run: |
          python tools/validate_website.py
          node --check progress/app.js
      - uses: actions/configure-pages@v6
      - name: Assemble site with canonical public data
        run: |
          mkdir -p public/data
          cp -R progress/. public/
          cp -R data/. public/data/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: deploy-site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
